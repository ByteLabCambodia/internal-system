name: Run DB Migrations

# Runs only after the CI workflow (docker-e2e.yml) finishes on main, and only if it
# passed — migrations shouldn't run against a change that failed its own tests. Vercel
# has no post-deploy hook (unlike Heroku's `release` phase in the Procfile), so this is
# the migration step for the Vercel/Heroku Postgres deployment.
on:
  workflow_run:
    workflows: ['NestJS API CI']
    types: [completed]
    branches: [main]

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci

      - name: Run migrations against Heroku Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ENABLED: 'true'
        run: npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js --dataSource=src/database/data-source.ts migration:run
